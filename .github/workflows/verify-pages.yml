name: Verify GitHub Pages output

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  rendered-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run source-level tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare controlled render fixture
        run: python3 tests/build_render_fixture.py .test-site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.test-site
          destination: ./_site-test
          future: true
      - name: Verify rendered output
        env:
          JEKYLL_SITE_DIR: ${{ github.workspace }}/_site-test
        run: python3 -m unittest tests.test_rendered_site -v
